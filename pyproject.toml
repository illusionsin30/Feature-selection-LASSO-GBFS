    "matplotlib>=3.9",
    "ipykernel",
    "jupyter",
    "torch>=2.11",
    "torchvision>=0.26",
    "marimo[recommended]",
    "openai>=2.32.0",
    "polars>=1.40.1",
    "duckdb>=1.5.2",
    "altair>=6.1.0",
    "ruff>=0.15.11",
    "scikit-learn>=1.8.0",
    "black>=26.3.1",
    "pytest>=9.0.3",
    "python-lsp-ruff>=2.3.1",
    "mcp>=1.27.0",
    "pydantic-settings>=2.14.0",
    "cattrs>=26.1.0",
    "pytokens>=0.4.1",
    "vegafusion>=2.0.3",
    "vl-convert-python>=1.9.0.post1",
    "arro3-core>=0.8.0",
